services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "7001:3000"
    environment:
      - BACKEND_URL=http://backend:7002
      - NODE_ENV=production
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7002:7002"
    environment:
      - MAX_FILE_SIZE_MB=200
      - SESSION_TTL_MINUTES=60
      - TEMP_PATH=/data/tmp
      - ALLOWED_EXT=.csv,.xls,.xlsx,.txt,.sql
      - CORS_ORIGIN=http://localhost:7001,http://frontend:3000
    volumes:
      - ./backend:/app
      - ./data/tmp:/data/tmp
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "7000:7000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    
volumes:
  data-tmp: